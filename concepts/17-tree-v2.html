<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pavlos · Growth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F4EF;--ink:#191816;--ink2:#4D4A44;--muted:#8E8A82;--line:rgba(25,24,22,.07);--card:#FFFFFF}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 Geist,Inter,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em;
    background-image:radial-gradient(ellipse 80% 40% at 50% 0%,rgba(255,255,255,.9),transparent 70%)}
  a{color:inherit;text-decoration:none}
  header{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:28px;padding:8px 8px 8px 18px;border-radius:999px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(25,24,22,.06);box-shadow:0 8px 24px -12px rgba(25,24,22,.18);font-size:13px}
  header b{font-weight:600}
  header nav{display:flex;gap:2px}
  header nav a{padding:6px 12px;border-radius:999px;color:var(--ink2)}
  header nav a.on{background:var(--ink);color:#fff}

  .intro{max-width:760px;margin:0 auto;padding:150px 24px 0;text-align:center}
  .badge{display:inline-flex;align-items:center;gap:8px;font:500 12px "Geist Mono",monospace;color:var(--ink2);padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .live{width:7px;height:7px;border-radius:50%;background:#2F9D6A;box-shadow:0 0 0 0 rgba(47,157,106,.5);animation:live 2s infinite}
  @keyframes live{70%{box-shadow:0 0 0 6px rgba(47,157,106,0)}100%{box-shadow:0 0 0 0 rgba(47,157,106,0)}}
  h1{font-weight:600;font-size:68px;line-height:1;letter-spacing:-.045em;margin-top:24px;text-wrap:balance}
  h1 span{color:#A7A196}
  .lead{margin:22px auto 0;max-width:560px;color:var(--ink2);font-size:16.5px;line-height:1.6;text-wrap:pretty}

  .index{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:900px;margin:40px auto 0;padding:0 24px}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s}
  .pill:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(25,24,22,.25)}
  .pill i{width:8px;height:8px;border-radius:50%}
  .pill small{font:500 11px "Geist Mono",monospace;color:var(--muted)}
  .pill.dead{color:var(--muted);background:transparent}
  .pill.dead i{background:transparent!important;border:1.5px solid #C9C3B8}

  .wrap{position:relative;margin-top:24px}
  .stage{position:relative;width:1200px;margin:0 auto;transform-origin:top center}
  svg{position:absolute;left:0;top:0;overflow:visible}
  .yr{font:500 12px "Geist Mono",monospace;fill:#ABA69C}
  .br path.stem{transition:stroke-dashoffset 1.8s cubic-bezier(.45,.05,.2,1)}
  .br .fade,.ev{opacity:0;transition:opacity .6s ease .9s,transform .6s ease .9s}
  .br.in .fade{opacity:1}
  .ev.in{opacity:1;transform:none}
  .br,.ev,.tag{transition:opacity .25s}
  .dimming .br:not(.hl),.dimming .ev:not(.hl),.dimming .tag:not(.hl){opacity:.12!important}
  .halo{animation:halo 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes halo{50%{transform:scale(1.5);opacity:.35}}
  .flow{stroke-dasharray:2 5;animation:flow 1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-7}}
  .leaf{transform-box:view-box;animation:sway 7s ease-in-out infinite}
  @keyframes sway{50%{transform:rotate(6deg)}}

  .ev{position:absolute;width:190px;transform:translateY(6px);cursor:pointer}
  .ev.r{text-align:right}
  .ev .d{font:500 11px "Geist Mono",monospace;color:var(--muted);display:flex;gap:6px;align-items:center}
  .ev.r .d{justify-content:flex-end}
  .ev .d em{font-style:normal;font-size:10px;padding:1px 6px;border-radius:4px;background:rgba(25,24,22,.05);color:var(--ink2);letter-spacing:.02em}
  .ev .t{font-size:14px;font-weight:500;line-height:1.35;margin-top:2px;letter-spacing:-.01em;text-wrap:pretty}
  .ev.dead .t{color:var(--muted);font-weight:400}
  .ev:hover .t{text-decoration:underline;text-decoration-color:rgba(25,24,22,.25);text-underline-offset:3px}
  .tag{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:7px;white-space:nowrap;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:500;background:var(--card);border:1px solid var(--line);box-shadow:0 4px 14px -6px rgba(25,24,22,.2)}
  .tag i{width:7px;height:7px;border-radius:50%}
  .tag small{font:500 10.5px "Geist Mono",monospace;color:var(--muted)}
  .tag.dead{background:var(--bg);box-shadow:none;color:var(--muted)}
  .today{position:absolute;left:0;transform:translateY(-50%);font:500 11px "Geist Mono",monospace;color:#fff;background:var(--ink);padding:3px 9px;border-radius:999px}

  .viewing{position:fixed;left:24px;bottom:24px;z-index:40;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 10px 30px -14px rgba(25,24,22,.3)}
  .viewing b{font-size:22px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .viewing small{display:block;font:500 11px "Geist Mono",monospace;color:var(--muted)}
  .prog{width:4px;height:36px;border-radius:2px;background:rgba(25,24,22,.08);overflow:hidden}
  .prog i{display:block;width:100%;background:var(--ink);border-radius:2px}
</style>
</head>
<body>
<header><b>Pavlos</b><nav><a class="on" href="#">Growth</a><a href="#">Writing</a><a href="#">About</a></nav></header>

<section class="intro">
  <span class="badge"><span class="live"></span>Living timeline · updated Nov 2026</span>
  <h1>Still growing, <span>one branch at a time.</span></h1>
  <p class="lead">I'm a product designer. Everything I spend time on becomes a branch. The ones I'm into keep growing. The ones I let go of stop where they ended. Start at today and scroll back to 2019.</p>
</section>
<div class="index" id="index"></div>

<div class="wrap" id="wrap"><div class="stage" id="stage"><svg id="svg"></svg></div></div>
<div class="viewing"><div class="prog"><i id="prog"></i></div><div><small>Viewing</small><b id="yr">2026</b></div></div>

<script src="timeline-data.js"></script>
<script>
  const W=1200,CX=600,PX=400,TOP=140,START=2018.85,H=TOP+(NOW-START)*PX+260,RISE=170;
  const Y=t=>TOP+(NOW-t)*PX;
  const SIDE={design:[-1,430],music:[-1,215],writing:[-1,215],photo:[1,430],climb:[1,430],print:[1,215],swift:[1,215]};
  const SEED={design:1,music:2.4,writing:3.1,photo:4.7,climb:5.3,print:6.2,swift:7.6};
  const DEAD='#C9C3B8',stage=document.getElementById('stage'),svg=document.getElementById('svg');
  stage.style.height=H+'px';svg.setAttribute('width',W);svg.setAttribute('height',H);
  const bx=b=>CX+SIDE[b.id][0]*SIDE[b.id][1];
  const forkY=b=>Y(b.ys)+RISE;
  const xAt=(b,y)=>{const top=forkY(b)-RISE,k=Math.max(0,Math.min(1,(top-y)/120));return bx(b)+k*4*Math.sin(y/150+SEED[b.id])};

  let s=`<defs><radialGradient id="glow"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#191816" stop-opacity=".15"/><stop offset=".25" stop-color="#191816" stop-opacity=".9"/><stop offset="1" stop-color="#191816"/></linearGradient>`;
  BRANCHES.forEach(b=>{if(b.ye)return;s+=`<linearGradient id="g-${b.id}" gradientUnits="userSpaceOnUse" x1="0" y1="${forkY(b)}" x2="0" y2="${forkY(b)-RISE*1.6}"><stop offset="0" stop-color="#191816" stop-opacity=".8"/><stop offset="1" stop-color="${CATS[b.cat].color}"/></linearGradient>`});
  s+=`</defs>`;

  for(let yr=2019;yr<=2026;yr++){const y=Y(yr);s+=`<line x1="56" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(25,24,22,.06)"/><text class="yr" x="0" y="${y-10}">${yr}</text>`}
  s+=`<line x1="72" x2="${W}" y1="${Y(NOW)}" y2="${Y(NOW)}" stroke="rgba(25,24,22,.18)" stroke-dasharray="3 5"/>`;

  const yRoot=Y(START)+40,yTip=Y(NOW)-44;
  s+=`<path d="M${CX-3.6},${yRoot} C${CX-3},${yRoot-600} ${CX-1.4},${yTip+500} ${CX-1.1},${yTip} L${CX+1.1},${yTip} C${CX+1.4},${yTip+500} ${CX+3},${yRoot-600} ${CX+3.6},${yRoot} Z" fill="url(#trunk)"/>`;
  s+=`<circle cx="${CX}" cy="${yTip-4}" r="3.5" fill="#191816"/>`;
  [[-1,120,90],[1,150,70],[-1,60,130],[1,70,120],[-1,190,50],[1,210,40]].forEach(([d,w,h],i)=>
    s+=`<path d="M${CX},${yRoot-8} C${CX+d*w*.25},${yRoot+h*.35} ${CX+d*w*.7},${yRoot+h*.55} ${CX+d*w},${yRoot+h}" stroke="#191816" stroke-opacity="${.22-i*.02}" stroke-width="1.2" fill="none" stroke-linecap="round"/>`);

  const evs=[],tags=[];
  BRANCHES.forEach(b=>{
    const side=SIDE[b.id][0],dead=!!b.ye,col=CATS[b.cat].color,X=bx(b),fy=forkY(b),top=fy-RISE,yE=dead?Y(b.ye):Y(NOW);
    let d=`M${CX},${fy} C${CX},${fy-RISE*.55} ${X},${fy-RISE*.5} ${X},${top}`;
    for(let y=top-10;y>=yE;y-=10)d+=` L${xAt(b,y).toFixed(1)},${y.toFixed(1)}`;
    d+=` L${xAt(b,yE).toFixed(1)},${yE}`;
    let g=`<g class="br" data-b="${b.id}" data-top="${yE}"><path class="stem" d="${d}" fill="none" stroke="${dead?DEAD:`url(#g-${b.id})`}" stroke-width="${dead?1.5:2.2}" stroke-linecap="round"/><g class="fade">`;
    if(!dead){let k=0;for(let y=yE+34;y<top-16;y+=58,k++){const x=xAt(b,y),dd=k%2?1:-1;
        g+=`<path class="leaf" style="transform-origin:${x}px ${y}px;animation-delay:${-k*.9}s" d="M${x},${y} c${dd*4},-6 ${dd*11},-8 ${dd*16},-5 c${-dd*4},5 ${-dd*10},7 ${-dd*16},5Z" fill="${col}" fill-opacity=".13" stroke="${col}" stroke-opacity=".55" stroke-width=".8"/>`}
      const xt=xAt(b,yE);
      g+=`<line x1="${xt}" y1="${yE}" x2="${xt}" y2="${yE-30}" stroke="${col}" stroke-width="2" stroke-linecap="round" class="flow" opacity=".7"/>`+
        `<circle cx="${xt}" cy="${yE-34}" r="14" fill="${col}" opacity=".16" class="halo"/><circle cx="${xt}" cy="${yE-34}" r="4.5" fill="${col}"/><circle cx="${xt}" cy="${yE-34}" r="1.6" fill="#fff"/>`;
      tags.push({b,x:xt,y:yE-52,html:`<i style="background:${col}"></i>${b.name}<small>growing</small>`,dead:false})}
    else{const xt=xAt(b,yE);g+=`<line x1="${xt-6}" y1="${yE-8}" x2="${xt+6}" y2="${yE-8}" stroke="${DEAD}" stroke-width="1.5" stroke-linecap="round"/>`;
      tags.push({b,x:xt,y:yE-18,html:`<i style="background:${DEAD}"></i>${b.name}<small>ended ${fmt(b.end)}</small>`,dead:true})}
    EVENTS.filter(e=>e.b===b.id).forEach(e=>{const y=Y(e.y),x=xAt(b,y);
      g+=e.kind==='start'?`<circle cx="${x}" cy="${y}" r="5" fill="var(--bg)" stroke="${dead?DEAD:col}" stroke-width="2"/>`
        :`<circle cx="${x}" cy="${y}" r="6.5" fill="var(--bg)"/><circle cx="${x}" cy="${y}" r="${e.kind==='end'?3.5:4}" fill="${dead?DEAD:col}"/>`;
      evs.push({e,b,x,y,side,dead})});
    s+=g+`</g></g>`});
  s+=`<g id="leaders"></g><text x="${CX}" y="${yRoot+150}" text-anchor="middle" style="font:600 15px Geist;fill:#191816;letter-spacing:-.01em">2019 · where it started</text><text x="${CX}" y="${yRoot+172}" text-anchor="middle" style="font:500 11px 'Geist Mono';fill:#8E8A82">Switched from graphic to product design</text>`;
  svg.innerHTML=s;

  stage.insertAdjacentHTML('beforeend',`<span class="today" style="top:${Y(NOW)}px">Today</span><span class="tag" style="left:${CX}px;top:${yTip-14}px;background:#191816;color:#fff;border-color:#191816">Pavlos</span>`);
  tags.forEach(t=>stage.insertAdjacentHTML('beforeend',`<span class="tag${t.dead?' dead':''}" data-b="${t.b.id}" style="left:${t.x}px;top:${t.y}px">${t.html}</span>`));
  const nodes=evs.map(v=>{const el=document.createElement('a');el.href='#';el.className=`ev${v.side>0?' r':''}${v.dead?' dead':''}`;el.dataset.b=v.b.id;
    const tag=v.e.kind==='start'?'<em>started</em>':v.e.kind==='end'?'<em>ended</em>':'';
    el.innerHTML=`<div class="d">${fmt(v.e.d)}${tag}</div><div class="t">${v.e.t}</div>`;stage.appendChild(el);return{...v,el}});
  let lead='';
  const outer=n=>Math.abs(n.x-CX)>300;
  nodes.forEach(n=>{if(n.e.kind==='start'&&outer(n))n.side=-n.side});
  BRANCHES.forEach(b=>{let prev=-1e9;nodes.filter(n=>n.b===b).sort((a,c)=>a.y-c.y).forEach(n=>{
    const h=n.el.offsetHeight,st=n.e.kind==='start';
    const top=st?(outer(n)?n.y-9:Math.max(n.y-h+12,prev+14)):Math.max(n.y-9,prev+14);if(!st)prev=top+h;
    const ax=n.side<0?n.x+24:n.x-24;n.el.style.top=top+'px';n.el.style.left=(n.side<0?ax:ax-190)+'px';
    if(top-(n.y-9)>4)lead+=`<path d="M${n.x-n.side*8},${n.y} C${ax},${n.y} ${n.x-n.side*10},${top+9} ${ax-n.side*-2},${top+9}" fill="none" stroke="rgba(25,24,22,.18)" stroke-width="1"/>`})});
  document.getElementById('leaders').innerHTML=lead;

  const idx=document.getElementById('index');
  [...BRANCHES].sort((a,c)=>(!!a.ye)-(!!c.ye)).forEach(b=>{const col=CATS[b.cat].color;
    idx.insertAdjacentHTML('beforeend',`<span class="pill${b.ye?' dead':''}" data-b="${b.id}"><i style="background:${col}"></i>${b.name}<small>${b.ye?`${b.start.slice(0,4)}–${b.end.slice(0,4)}`:`since ${b.start.slice(0,4)}`}</small></span>`)});

  const hl=id=>{document.body.classList.toggle('dimming',!!id);document.querySelectorAll('[data-b]').forEach(el=>el.classList.toggle('hl',el.dataset.b===id))};
  document.querySelectorAll('.pill,.ev,.tag').forEach(el=>{el.addEventListener('mouseenter',()=>hl(el.dataset.b));el.addEventListener('mouseleave',()=>hl(null))});
  const wrap=document.getElementById('wrap');
  document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>{const g=document.querySelector(`.br[data-b="${p.dataset.b}"]`);
    scrollTo({top:wrap.offsetTop+(+g.dataset.top)*k-innerHeight*.35,behavior:'smooth'})});

  document.querySelectorAll('.br .stem').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L});
  let k=1;const fit=()=>{k=Math.min(1,(innerWidth-32)/W);stage.style.transform=`scale(${k})`;wrap.style.height=H*k+'px'};fit();addEventListener('resize',fit);
  const groups=[...document.querySelectorAll('.br')];
  function tick(){const vb=scrollY+innerHeight*.92-wrap.offsetTop;
    groups.forEach(g=>{if(!g.classList.contains('in')&&+g.dataset.top*k<vb){g.classList.add('in');g.querySelector('.stem').style.strokeDashoffset=0}});
    nodes.forEach(n=>{if(!n.el.classList.contains('in')&&n.y*k<vb+40)n.el.classList.add('in')});
    const t=NOW-((scrollY+innerHeight*.5-wrap.offsetTop)/k-TOP)/PX,c=Math.max(2019,Math.min(2026,Math.floor(t)));
    document.getElementById('yr').textContent=c;document.getElementById('prog').style.height=Math.max(6,Math.min(100,(NOW-Math.min(NOW,t))/(NOW-2019)*100))+'%'}
  addEventListener('scroll',tick);document.fonts.ready.then(tick);tick();
</script>
</body>
</html>
