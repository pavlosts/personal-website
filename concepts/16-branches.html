<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pavlos · Branches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F2EA;--ink:#1F1D1A;--muted:#8A8378;--line:#E6E0D4;--card:#FFFDF8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 Inter,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 32px 120px}
  header{display:flex;justify-content:space-between;font-size:13px}
  header nav{display:flex;gap:24px;color:var(--muted)}
  .intro{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:end;margin:72px 0 40px}
  h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:58px;line-height:1;letter-spacing:-.015em}
  h1 em{color:#8A7B66}
  .intro p{color:#5F574B;font-size:15px;line-height:1.65}
  .bar{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(246,242,234,.92);backdrop-filter:blur(8px);z-index:20}
  .chips{display:flex;gap:6px}
  .chip{display:flex;align-items:center;gap:7px;font:500 13px Inter,sans-serif;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s}
  .chip i{width:8px;height:8px;border-radius:50%}
  .chip.on{color:var(--ink);border-color:#CFC7B8}
  .chip.off{opacity:.45}
  .legend{display:flex;gap:18px;font-size:12px;color:var(--muted);align-items:center}
  .legend span{display:flex;align-items:center;gap:7px}
  .graph{position:relative;margin-top:10px}
  .graph>svg{position:absolute;left:0;top:0;overflow:visible}
  .lane{transition:opacity .25s}
  .row{position:absolute;left:180px;right:0;height:56px;display:grid;grid-template-columns:96px 1fr auto;gap:18px;align-items:center;padding:0 16px;border-radius:12px;transition:background .2s,opacity .25s;cursor:pointer}
  .row:hover{background:var(--card);box-shadow:0 1px 0 var(--line)}
  .row time{font:12px "IBM Plex Mono",monospace;color:var(--muted)}
  .row .t{font-size:16px;letter-spacing:-.01em}
  .row .t small{display:inline-block;margin-left:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;vertical-align:2px}
  .row .b{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .row .b i{width:8px;height:8px;border-radius:2px}
  .row.dim,.lane.dim{opacity:.18}
  .year{position:absolute;left:180px;right:0;padding:0 16px;font-family:"Instrument Serif",serif;font-size:30px;color:#B3AA9B;border-bottom:1px solid var(--line);height:40px;line-height:40px}
  .now{position:absolute;left:180px;right:0;top:0;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:14px}
  .now b{font-weight:600}
  .now span{color:var(--muted)}
  .pulse{animation:pulse 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3.2);opacity:0}}
  .grow{stroke-dasharray:4 5;animation:grow 1.2s linear infinite}
  @keyframes grow{to{stroke-dashoffset:-9}}
</style>
</head>
<body>
<div class="wrap">
  <header><b>Pavlos</b><nav><a href="#">Timeline</a><a href="#">Writing</a><a href="#">About</a><a href="#">RSS</a></nav></header>
  <section class="intro">
    <h1>Everything I'm doing, <em>as branches.</em></h1>
    <p>I'm a product designer. Each thing I pick up gets its own branch. The ones I'm still into keep growing at the top. The ones I've let go of stop where they ended. Start at today and follow any line back.</p>
  </section>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <div class="legend">
      <span><svg width="22" height="14"><line x1="11" y1="14" x2="11" y2="2" stroke="#2F6B5A" stroke-width="3" stroke-linecap="round" class="grow"/></svg>Still growing</span>
      <span><svg width="22" height="14"><line x1="11" y1="14" x2="11" y2="5" stroke="#B3AA9B" stroke-width="3"/><line x1="6" y1="4" x2="16" y2="4" stroke="#B3AA9B" stroke-width="2.5" stroke-linecap="round"/></svg>Ended</span>
    </div>
  </div>
  <div class="graph" id="graph"></div>
</div>
<script src="timeline-data.js"></script>
<script>
  const LANE={design:0,writing:1,photo:2,climb:2,music:3,print:3,swift:3};
  const LX=i=>34+i*36, ROW=64, G=document.getElementById('graph');
  let y=88,prevYear=null;const pos=new Map(),years=[];
  EVENTS.forEach(e=>{const yr=Math.floor(e.y);if(yr!==prevYear){years.push([yr,y+6]);y+=56;prevYear=yr}pos.set(e,y+28);y+=ROW});
  const H=y+40;G.style.height=H+'px';
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',180);svg.setAttribute('height',H);G.appendChild(svg);
  const ev=b=>EVENTS.filter(e=>e.b===b.id);
  let out='';
  [...BRANCHES].reverse().forEach(b=>{
    const c=CATS[b.cat].color,x=LX(LANE[b.id]),es=ev(b),yS=pos.get(es[es.length-1]),yE=b.ye?pos.get(es[0]):28,dx=LX(0);
    const alive=!b.ye,stroke=alive?c:'#C3BAAB';
    let g=`<g class="lane" data-b="${b.id}">`;
    if(b.id==='design'){g+=`<path d="M${x},${yE} V${yS+26}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round"/>`}
    else{g+=`<path d="M${x},${yE} V${yS} C${x},${yS+30} ${dx},${yS+20} ${dx},${yS+52}" stroke="${stroke}" stroke-width="3" fill="none" stroke-linecap="round"/>`}
    if(alive){g+=`<line x1="${x}" y1="${yE}" x2="${x}" y2="${yE-22}" stroke="${c}" stroke-width="3" stroke-linecap="round" class="grow"/><circle cx="${x}" cy="${yE-24}" r="5" fill="${c}" class="pulse"/><circle cx="${x}" cy="${yE-24}" r="4" fill="${c}"/>`}
    else{g+=`<line x1="${x-8}" y1="${yE-14}" x2="${x+8}" y2="${yE-14}" stroke="#C3BAAB" stroke-width="2.5" stroke-linecap="round"/>`}
    es.forEach(e=>{const yy=pos.get(e);
      g+=e.kind==='end'?`<circle cx="${x}" cy="${yy}" r="6" fill="var(--bg)" stroke="#B3AA9B" stroke-width="2.5"/>`
        :e.kind==='start'?`<circle cx="${x}" cy="${yy}" r="6" fill="var(--bg)" stroke="${stroke}" stroke-width="3"/>`
        :`<circle cx="${x}" cy="${yy}" r="6" fill="${stroke}" stroke="var(--bg)" stroke-width="2.5"/>`});
    out+=g+'</g>'});
  svg.innerHTML=out;
  const alive=BRANCHES.filter(b=>!b.ye);
  G.insertAdjacentHTML('beforeend',`<div class="now"><b>Now</b><span>${alive.length} branches growing: ${alive.map(b=>b.name).join(', ')}</span></div>`);
  years.forEach(([yr,yy])=>G.insertAdjacentHTML('beforeend',`<div class="year" style="top:${yy}px">${yr}</div>`));
  EVENTS.forEach(e=>{const b=e.branch,c=CATS[b.cat].color,tag=e.kind==='start'?'<small>started</small>':e.kind==='end'?'<small>ended</small>':'';
    G.insertAdjacentHTML('beforeend',`<a class="row" href="#" data-b="${b.id}" data-c="${b.cat}" style="top:${pos.get(e)-28}px"><time>${fmt(e.d)}</time><span class="t">${e.t}${tag}</span><span class="b"><i style="background:${b.ye?'#C3BAAB':c}"></i>${b.name}</span></a>`)});
  const lanes=[...document.querySelectorAll('.lane')],rows=[...document.querySelectorAll('.row')];
  let active=new Set(Object.keys(CATS));
  const apply=(hb)=>{rows.forEach(r=>r.classList.toggle('dim',hb?r.dataset.b!==hb:!active.has(r.dataset.c)));
    lanes.forEach(l=>l.classList.toggle('dim',hb?l.dataset.b!==hb:!active.has(branch(l.dataset.b).cat)))};
  rows.forEach(r=>{r.onmouseenter=()=>apply(r.dataset.b);r.onmouseleave=()=>apply()});
  const chips=document.getElementById('chips');
  Object.entries(CATS).forEach(([k,v])=>{const el=document.createElement('button');el.className='chip on';el.innerHTML=`<i style="background:${v.color}"></i>${v.label}`;
    el.onclick=()=>{active.has(k)&&active.size>1?active.delete(k):active.add(k);el.classList.toggle('off',!active.has(k));apply()};chips.appendChild(el)});
</script>
</body>
</html>
